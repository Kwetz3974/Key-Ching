<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Key-Ching: learn to protect your Bitcoin keys, earn sats</title>
<link rel="prefetch" href="/videos/intro.mp4"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Design tokens. Each phase of the journey owns a colour, so the page itself tells you where you are. */
:root{--cobalt:#2434f0;--ink:#0a0f2e;--chalk:#eef0ff;--brass:#f0b84a;--red:#ff5a47;--green:#3ddc97;
--display:"Bricolage Grotesque",system-ui,sans-serif;--read:"Newsreader",Georgia,serif}
*{box-sizing:border-box;margin:0}
body{--bg:var(--cobalt);--fg:var(--chalk);--accent:var(--brass);background:var(--bg);color:var(--fg);font-family:var(--display);
min-height:100dvh;transition:background-color .5s,color .5s;-webkit-font-smoothing:antialiased}
body[data-p=learn]{--bg:var(--cobalt);--fg:var(--chalk);--accent:var(--brass)}
body[data-p=sim]{--bg:#0e1673;--fg:var(--chalk);--accent:var(--brass)}
body[data-p=test]{--bg:var(--brass);--fg:var(--ink);--accent:var(--ink)}
body[data-p=earn]{--bg:var(--cobalt);--fg:var(--chalk);--accent:var(--brass)}
body{background-image:radial-gradient(ellipse 70% 55% at 88% -8%,rgba(240,184,74,.3),transparent 70%),radial-gradient(ellipse 60% 50% at -10% 105%,rgba(240,184,74,.14),transparent 70%);background-attachment:fixed}
body[data-p=test]{background-image:none}
::selection{background:var(--brass);color:var(--ink)}
.hl{color:var(--brass)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{min-height:62vh}.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(18px,5vw,48px)}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.03em;background:none;border:0;cursor:pointer}
.link{background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;opacity:.8}
h1{font-weight:800;font-size:clamp(3rem,13vw,9rem);line-height:.88;letter-spacing:-.05em}
h2{font-weight:800;font-size:clamp(2rem,6vw,4rem);line-height:1;letter-spacing:-.04em}
.lede{font-family:var(--read);font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.45;max-width:36ch;margin-top:24px;opacity:.92}
.hero{padding:clamp(20px,6vh,60px) 0 20px;display:grid;gap:28px}
.keywrap{transition:transform .25s ease-out;transform-origin:20% 50%;width:min(100%,640px)}
.keywrap.turn{transform:rotate(90deg);transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.key .t{fill:none;stroke:currentColor;stroke-width:3;transition:fill .6s}.key .t.on{fill:var(--brass);stroke:var(--brass)}
.key .b{fill:none;stroke:currentColor;stroke-width:3}
.rows{margin:36px 0 80px;border-top:2px solid currentColor}
.row{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:16px;text-align:left;background:none;border:0;border-bottom:2px solid currentColor;
padding:22px 0;cursor:pointer;transition:padding .2s}
.row:hover:not(:disabled){padding-left:14px;color:var(--brass)}.row:disabled{opacity:.45;cursor:not-allowed}
.row b{font-size:clamp(1.5rem,4.5vw,2.8rem);letter-spacing:-.04em;font-weight:800}
.row span{font-family:var(--read);font-size:1.1rem;white-space:nowrap}
.done{color:var(--brass)}
/* Flow screens */
.flow{min-height:calc(100dvh - 70px);display:flex;flex-direction:column;padding-bottom:32px}
.phases{display:flex;gap:6px;margin-bottom:8px}
.phases i{flex:1;height:6px;border-radius:3px;background:currentColor;opacity:.2}.phases i.on{opacity:1;background:var(--accent)}
.phasename{font-family:var(--read);font-size:1.05rem;margin-bottom:6vh}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.read{font-family:var(--read);font-weight:500;font-size:clamp(1.6rem,4.6vw,3rem);line-height:1.18;letter-spacing:-.015em;max-width:24ch}
.choices{display:grid;gap:12px;max-width:760px}
.choice{text-align:left;font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:500;padding:18px 20px;border-radius:14px;border:2px solid currentColor;background:none;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.choice:hover{background:var(--fg);color:var(--bg)}.choice:active{transform:scale(.99)}
.choice.sel{background:var(--fg);color:var(--bg)}
.fb{font-family:var(--read);font-size:1.3rem;line-height:1.4;padding:18px 20px;border-radius:14px;max-width:760px;animation:in .3s}
.fb.good{background:var(--green);color:var(--ink)}.fb.bad{background:var(--red);color:var(--ink)}
.btn{align-self:flex-start;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:16px 30px;font-weight:800;font-size:1.15rem;cursor:pointer;letter-spacing:-.02em;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.ghost{background:none;color:var(--fg);border:2px solid currentColor}
.vid{width:100%;max-width:760px;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
.recs{max-width:760px;border-top:2px solid currentColor}.rec{display:flex;justify-content:space-between;padding:12px 0;border-bottom:2px solid currentColor;font-size:1.2rem}
.pledge{display:flex;gap:14px;align-items:flex-start;cursor:pointer}.pledge input{width:22px;height:22px;margin-top:3px;accent-color:var(--brass);flex:none}
.badge{background:var(--brass);color:var(--ink);border-radius:22px;padding:28px;display:grid;gap:8px;max-width:420px;transform:rotate(-2deg)}
.badge b{font-size:2.4rem;letter-spacing:-.04em;font-weight:800}.badge span{font-family:var(--read);font-size:1.1rem}
.badge .key .t.on{fill:var(--ink);stroke:var(--ink)}
video.vid{aspect-ratio:auto;width:auto;max-width:100%;max-height:62vh}
body[data-p=film]{--bg:#0d0d0f;--fg:var(--chalk);--accent:var(--brass)}
.film{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;overflow:hidden;background:#0d0d0f;color:var(--chalk)}
.film .bg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(38px) grayscale(1) brightness(.45);z-index:-1}
.film .screen{width:min(92vw,880px,calc(46vh*16/9));aspect-ratio:16/9;overflow:hidden;border-radius:16px;border:6px solid #1b1b1f;background:#000;box-shadow:0 30px 80px #000a}
.film .main{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.22)}
.film h2{font-size:clamp(2rem,7vw,4.5rem)}.film .lede{margin:0 auto}
.acts{display:flex;gap:12px;flex-wrap:wrap}
input[type=text]{width:100%;max-width:560px;background:none;border:0;border-bottom:3px solid currentColor;padding:12px 0;font-size:clamp(1.3rem,4vw,2rem);font-weight:500;border-radius:0}
input::placeholder{color:currentColor;opacity:.45}
.err{color:var(--brass);min-height:1.4em;font-family:var(--read);font-size:1.1rem}
.sats{font-size:clamp(4rem,18vw,11rem);font-weight:800;letter-spacing:-.06em;line-height:.9}
.note{font-family:var(--read);opacity:.75;font-size:.95rem;padding:24px 0 32px;max-width:60ch}
.intro .hero>*{opacity:0;animation:in .35s ease-out forwards}.intro .hero>:nth-child(2){animation-delay:.05s}.intro .hero>:nth-child(3){animation-delay:.1s}
.lv{display:block;font:500 1rem var(--read);opacity:.8;letter-spacing:0;margin-bottom:2px}
.tot{font-family:var(--read);font-size:1.15rem;margin-top:6px}
.phone{background:#0b0b0f;color:#eee;border-radius:24px;max-width:440px;width:100%;padding:18px;border:6px solid #1b1b1f;box-shadow:0 30px 80px #0008;display:grid;gap:14px}
.ph-h{display:flex;justify-content:space-between;font-weight:800}.ph-h span+span{font:500 .95rem var(--read);opacity:.7}
.phone p{font-family:var(--read);font-size:1.1rem;line-height:1.4}.phone .btn{width:100%;text-align:center}.phone h2{font-size:2.6rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px dashed #555;border-radius:10px;padding:8px;min-height:40px;font-family:var(--read);font-size:.95rem}.slot.f{border:2px solid var(--brass);color:var(--brass)}
.bank{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#23232b;color:#eee;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:1rem}.chip:disabled{opacity:.25}
.paper{background:#f4ecd8;color:#222;border-radius:10px;padding:12px;font-family:var(--read);display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
.paper.warn{background:#3a1d1d;color:#ffe9c4;display:block}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pb{height:10px;background:#23232b;border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--brass);transition:width .6s}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dots{display:flex;gap:12px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #888}.dots i.f{background:var(--brass);border-color:var(--brass)}
.msg{min-height:1.4em;color:var(--brass)}
.mail{background:#1b1b22;color:#eee;border-radius:10px;padding:12px;font-family:var(--read);line-height:1.35}.mail small{opacity:.7}.mail u{color:var(--brass);word-break:break-all}
.addr{display:grid;gap:4px}.addr small{opacity:.7}.addr code{background:#16161c;border-radius:8px;padding:10px;font:600 1rem ui-monospace,monospace;letter-spacing:.04em;word-break:break-all}
.bank .chip{border-radius:14px;text-align:left}.chip.sel{background:var(--brass);color:#111}
.phone .btn.ghost{border-radius:14px;text-align:left;font-weight:500;font-size:1rem;padding:12px 16px}
.res{display:grid;gap:6px;font-family:var(--read)}.res .ok{color:var(--green)}.res .no{color:var(--red)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.intro .hero>*{opacity:1}}
</style></head><body data-p="home">
<div class="wrap">
<header><button class="logo" onclick="home()" aria-label="Key-Ching home">Key-Ching</button><button class="link" id="exit" hidden onclick="home()">Leave lesson</button></header>
<main id="app"></main>
<p class="note">Key-Ching is for education only. Never type your real recovery phrase, private keys or PIN into any website, including this one. Every scenario here is fictional.</p>
</div>
<script>
const uid=localStorage.kcUid||(localStorage.kcUid=crypto.randomUUID());
const $=document.getElementById("app");let data,progress,answers=[];
const api=(p,o)=>fetch("/api"+p,o).then(r=>r.json());
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid,...b})});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vid=(v,c)=>{const y=String(v).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  return y?`<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${y[1]}" title="${esc(c||"Video")}" allow="encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>`
  :`<video class="vid" src="${esc(v)}" controls playsinline preload="metadata"></video>`};
const mod=id=>data.modules.find(m=>m.id===id);
const phase=(p)=>{document.body.dataset.p=p;document.getElementById("exit").hidden=p==="home";window.scrollTo(0,0)};
const bar=(n,name)=>`<div class="phases" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><p class="phasename">${name}</p>`;

/* The key: one tooth per module, plus one for the reward. Teeth fill with brass as you earn them. */
function keySvg(flags){
  const n=flags.length,step=280/n,w=Math.min(40,step-12),h=[38,58,30,50,42,34];
  return `<svg class="key" viewBox="0 0 640 190" role="img" aria-label="A key with ${n} teeth, ${flags.filter(Boolean).length} earned">
  <circle class="b" cx="90" cy="95" r="72"/><circle class="b" cx="90" cy="95" r="26"/>
  <rect class="b" x="162" y="84" width="440" height="24" rx="5"/>
  ${flags.map((f,i)=>`<rect class="t ${f?"on":""}" x="${300+i*step}" y="108" width="${w}" height="${h[i%6]}" rx="4"/>`).join("")}</svg>`;
}
const tilt=e=>{const k=document.querySelector(".keywrap:not(.turn)");if(k)k.style.transform=`rotate(${(e.clientX/innerWidth-.5)*10}deg) translateY(${(e.clientY/innerHeight-.5)*8}px)`};
addEventListener("pointermove",tilt);

function film(next){
  phase("film");$.className="";
  $.innerHTML=`<div class="film"><video class="bg" src="/videos/intro.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="screen"><video class="main" src="/videos/intro.mp4" autoplay muted loop playsinline preload="auto"></video></div>
  <h2>Your keys. Your coins.</h2><p class="lede">If you don't hold the keys, you don't really hold the coins. Let's learn how to protect them.</p>
  <div class="acts" style="justify-content:center"><button class="btn" onclick="localStorage.kcSeen=1;${next?`learn('${next}',0)`:"home()"}">${next?"Start learning":"Back to your key"}</button></div></div>`;
}
const jget=k=>{try{return JSON.parse(localStorage[k])}catch(e){return null}};
const jset=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
let fresh=false,shown=false;
/* Paint instantly from the last visit's saved data, then refresh quietly in the background. */
function fillHome(){
  const mods=data?data.modules:[],P=progress||{},pa=P.passed||{},dn=P.done||{},cl=P.claims||{};
  const flags=mods.length?mods.map(m=>!!dn[m.id]):[false,false,false];
  const earned=mods.reduce((a,m)=>a+(dn[m.id]?m.sats:0),0),got=mods.reduce((a,m)=>a+(cl[m.id]?m.sats:0),0);
  const kw=document.getElementById("kw"),rw=document.getElementById("rw"),tt=document.getElementById("tot");if(!kw||!rw)return;
  kw.innerHTML=keySvg(flags);tt.textContent=mods.length?`Earned ${earned} sats so far. Claimed ${got}.`:"";
  rw.innerHTML=mods.length?mods.map((m,i)=>{
    const lock=i>0&&!dn[mods[i-1].id];let st,act=`learn('${m.id}',0)`;
    if(cl[m.id]){st=`Claimed, ${esc(cl[m.id].status)}`;act=`status(progress.claims['${m.id}'])`}
    else if(dn[m.id]){st=`Claim +${m.sats} sats`;act=`reward('${m.id}')`}
    else if(pa[m.id]){st="Finish the simulations";act=`recover('${m.id}')`}
    else st=lock?"Locked":`Start, +${m.sats} sats`;
    return `<button class="row" ${lock?"disabled":""} onclick="${act}"><b><small class="lv">Level ${i+1}, ${esc(m.level)}</small>${esc(m.title)}</b><span>${st}</span></button>`}).join("")
  :`<button class="row" disabled><b>Loading levels…</b><span></span></button>`;
}
async function home(){
  phase("home");answers=[];data=data||jget("kcData");progress=progress||jget("kcProg");
  $.className=shown?"":"intro";shown=true;
  $.innerHTML=`<section class="hero"><h1>Keep your keys.<br><span class="hl">Earn your sats.</span></h1>
  <p class="lede">Learn how Bitcoin self-custody works, pass the questions, practise recovering a wallet, and earn sats at every level.</p><button class="link" onclick="film(null)">Watch the intro</button>
  <div class="keywrap" id="kw"></div><p class="tot" id="tot"></p></section><div class="rows" id="rw"></div>`;
  fillHome();
  try{
    const before=JSON.stringify([data,progress]);
    const [d,pr]=await Promise.all([fresh&&data&&data.demo?data:api("/modules"),api("/progress/"+uid)]);
    data=d;progress=pr;fresh=true;jset("kcData",d);jset("kcProg",pr);
    if(JSON.stringify([data,progress])!==before&&document.body.dataset.p==="home")fillHome();
  }catch(e){}
}
function learn(id,i){
  if(!i&&id===data.modules[0].id&&!localStorage.kcSeen)return film(id);
  const m=mod(id),last=i===m.lessons.length-1;phase("learn");$.className="";
  $.innerHTML=`<div class="flow">${bar(0,`Learn: ${esc(m.title)}, ${i+1} of ${m.lessons.length}`)}
  <div class="stage" key="${i}">${typeof m.lessons[i]==="string"?`<p class="read">${esc(m.lessons[i])}</p>`:`${vid(m.lessons[i].video,m.lessons[i].caption)}<p class="lede" style="margin:0">${esc(m.lessons[i].caption||"")}</p>`}
  <div class="acts"><button class="btn" onclick="${last?`sim('${id}')`:`learn('${id}',${i+1})`}">${last?"Try a scenario":"Next"}</button>
  ${i?`<button class="btn ghost" onclick="learn('${id}',${i-1})">Back</button>`:""}</div></div></div>`;
}
function sim(id){
  const s=mod(id).simulation;phase("sim");
  $.innerHTML=`<div class="flow">${bar(1,"Simulate: what would you do?")}<div class="stage"><p class="read">${esc(s.prompt)}</p>
  <div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="simPick('${id}',${i})">${esc(c.text)}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></div></div>`;
}
function simPick(id,i){
  const c=mod(id).simulation.choices[i];
  document.getElementById("fb").innerHTML=`<p class="fb ${c.good?"good":"bad"}">${esc(c.feedback)}</p><div class="acts" style="margin-top:16px">
  <button class="btn" onclick="${c.good?`quiz('${id}',0)`:`sim('${id}')`}">${c.good?"Take the test":"Try again"}</button></div>`;
}
function quiz(id,i){
  const m=mod(id),q=m.quiz[i];phase("test");if(!i)answers=[];
  $.innerHTML=`<div class="flow">${bar(2,`Test: question ${i+1} of ${m.quiz.length}`)}<div class="stage"><p class="read">${esc(q.q)}</p>
  <div class="choices">${q.options.map((o,oi)=>`<button class="choice" onclick="pick('${id}',${i},${oi},this)">${esc(o)}</button>`).join("")}</div></div></div>`;
}
function pick(id,i,oi,el){
  answers[i]=oi;el.classList.add("sel");
  setTimeout(()=>i<mod(id).quiz.length-1?quiz(id,i+1):submit(id),260);
}
const pstate=()=>{progress=progress||{};["passed","scores","done","claims"].forEach(k=>progress[k]=progress[k]||{});return progress};
async function submit(id){
  const r=await post("/quiz/"+id,{answers});
  if(r.error){$.innerHTML=`<div class="flow"><div class="stage"><h2>${esc(r.error)}</h2><div class="acts"><button class="btn" onclick="home()">Back</button></div></div></div>`;return}
  const P=pstate();P.scores[id]=Math.max(P.scores[id]||0,r.score);if(r.passed)P.passed[id]=true;jset("kcProg",P);
  if(r.passed&&!P.done[id]){phase("sim");
    $.innerHTML=`<div class="flow">${bar(2,"Test result")}<div class="stage"><h2>${r.correct} of ${r.total} correct.</h2>
    <p class="read">You passed. Last step: hands-on simulations. Everything in them is fictional.</p>
    <div class="acts"><button class="btn" onclick="recover('${id}')">Start the simulations</button></div></div></div>`;return}
  phase(r.passed?"test":"sim");
  $.innerHTML=`<div class="flow">${bar(2,"Test result")}<div class="stage"><h2>${r.correct} of ${r.total} correct.</h2>
  <p class="read">${r.passed?"Passed.":`Not yet. This level needs ${Math.round(r.need*100)}%. Read the lessons again and retry.`}</p>
  <div class="acts"><button class="btn" onclick="${r.passed?"home()":`learn('${id}',0)`}">${r.passed?"Back to your key":"Review lessons"}</button></div></div></div>`;
}
/* Simulations: each level lists its own in modules.json ("sims"). Types: recovery, scenes, backup. Tap-only, fictional data. */
let R=null,C=null,B=null,S=null;
const grp=a=>String(a).replace(/(.{4})/g,"$1 ").trim();
const sub=t=>String(t).replace(/\{w(\d+)\}/g,(_,n)=>data.demo.phrase[n-1]);
const sims=()=>mod(S.id).sims||[];
const nextBtn=()=>`<button class="btn" onclick="simDone()">${S.i+1>=sims().length?"Finish level":"Next simulation"}</button>`;
const shake=()=>{const e=document.getElementById("ph");if(e)e.classList.add("shake")};
function shell(title,lab,b){$.innerHTML=`<div class="flow">${bar(2,`Simulation ${S.i+1} of ${sims().length}: ${esc(title)}. Demo only.`)}<div class="stage"><div class="phone" id="ph"><div class="ph-h"><span>${esc(title)}</span><span>${lab||""}</span></div>${b}</div></div></div>`}
function recover(id){S={id,i:0};nextSim()}
function nextSim(){const sim=sims()[S.i];if(!sim)return finishSim();phase("sim");
  if(sim.type==="recovery"){const d=data.demo;R={sim,words:d.phrase,bank:[...d.phrase,...d.decoys].sort(()=>Math.random()-.5),slots:[],step:"intro",peek:false,msg:"",pin:""};rv()}
  else if(sim.type==="backup"){B={sim,pick:[],res:null,intro:true};bv()}
  else{C={sim,k:0,miss:0,fb:"",intro:true};cv()}}
function simDone(){S.i++;nextSim()}
/* recovery: restore a wallet from a paper backup */
function rv(){const s=R.step,w=R.words;let b="";
  if(s==="intro")b=`<p>${esc(R.sim.intro)}</p><button class="btn" onclick="R.step='enter';rv()">Open the wallet app</button>`;
  if(s==="enter")b=`<p>Tap your words in order.</p><div class="slots">${w.map((x,i)=>`<div class="slot ${R.slots[i]?"f":""}">${i+1}. ${R.slots[i]||""}</div>`).join("")}</div>
  <p class="msg">${R.msg}</p><div class="bank">${R.bank.map(x=>`<button class="chip" ${R.slots.includes(x)?"disabled":""} onclick="tapWord('${esc(x)}')">${esc(x)}</button>`).join("")}</div>
  <button class="btn ghost" onclick="R.peek=!R.peek;rv()">${R.peek?"Hide":"Show"} my paper backup</button>${R.peek?`<div class="paper">${w.map((x,i)=>`<span>${i+1}. ${esc(x)}</span>`).join("")}</div>`:""}`;
  if(s==="scan")b=`<p id="sc">Deriving keys…</p><div class="pb"><i id="pf"></i></div>`;
  if(s==="pin")b=`<p>Set a new PIN for this phone. It only unlocks the app. It can't restore anything.</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<R.pin.length?"f":""}"></i>`).join("")}</div>
  <div class="pin">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button class="chip" onclick="pinTap('${k}')">${k}</button>`).join("")}</div>`;
  if(s==="done")b=`<h2 id="bal">0</h2><p>sats restored. In real life, if your phrase was ever exposed, move funds to a fresh wallet, test recovery with a small amount, and keep the paper offline.</p>${nextBtn()}`;
  shell(R.sim.title,{intro:"",enter:"Restore",scan:"Syncing",pin:"New PIN",done:"Ready"}[s],b);
  if(s==="scan")scan();if(s==="done")countUp()}
function tapWord(x){const n=R.slots.length;if(x!==R.words[n]){R.msg=`Not word #${n+1}. Check your paper backup.`;rv();shake();return}
  R.slots.push(x);R.msg="";if(R.slots.length===R.words.length)R.step="scan";rv()}
function scan(){const t=["Deriving keys…","Scanning addresses 1 to 20…","Found 3 used addresses…","Checking balance…"];let i=0;
  const go=()=>{if(!R||R.step!=="scan")return;const sc=document.getElementById("sc"),pf=document.getElementById("pf");if(sc){sc.textContent=t[i];pf.style.width=(i+1)*25+"%"}
    i++;setTimeout(i<t.length?go:()=>{if(R&&R.step==="scan"){R.step="pin";rv()}},900)};setTimeout(go,120)}
function pinTap(k){if(k==="⌫")R.pin=R.pin.slice(0,-1);else if(R.pin.length<4)R.pin+=k;if(R.pin.length===4)R.step="done";rv()}
function countUp(){const el=document.getElementById("bal"),to=R.sim.balance||0;let t=0;const iv=setInterval(()=>{t+=Math.ceil(to/25);if(t>=to){t=to;clearInterval(iv)}if(el)el.textContent=t.toLocaleString()},40)}
/* scenes: a chain of cards (mail, address, words) with choices. A wrong pick explains why and lets you retry. */
function cardHtml(c){
  if(c.kind==="mail")return `<div class="mail"><small>From: ${esc(c.from)}</small><br><b>${esc(c.subject)}</b><br>${esc(c.body)}${c.link?`<br><u>${esc(c.link)}</u>`:""}</div>`;
  if(c.kind==="addr")return `<div class="addr"><small>${esc(c.la||"Computer screen")}</small><code>${grp(c.a)}</code><small>${esc(c.lb||"Hardware wallet screen")}</small><code>${grp(c.b)}</code></div>`;
  if(c.kind==="words")return `<div class="paper">${data.demo.phrase.map((x,i)=>`<span>${i+1}. ${esc(x)}</span>`).join("")}</div>`;return ""}
function cv(){const sim=C.sim,sc=sim.scenes[C.k];
  if(C.intro)return shell(sim.title,"",`<p>${esc(sim.intro)}</p><button class="btn" onclick="C.intro=false;cv()">Start</button>`);
  if(!sc)return shell(sim.title,"Done",`<h2>${C.miss?C.miss+" slip"+(C.miss>1?"s":""):"Flawless"}.</h2><p class="msg">${esc(C.fb)}</p><p>${esc(sim.wrap||"")}</p>${nextBtn()}`);
  shell(sim.title,`${C.k+1} of ${sim.scenes.length}`,`${sc.card?cardHtml(sc.card):""}<p><b>${esc(sub(sc.q))}</b></p>${sc.options.map((o,i)=>`<button class="btn ghost" onclick="pickScene(${i})">${esc(sub(o.t))}</button>`).join("")}<p class="msg">${esc(C.fb)}</p>`)}
function pickScene(i){const o=C.sim.scenes[C.k].options[i];
  if(o.good){C.k++;C.fb="✓ "+o.fb;cv()}else{C.miss++;C.fb="✗ "+o.fb;cv();shake()}}
/* backup builder: pick a storage plan, then run the disasters against it */
function bv(){const sim=B.sim;
  if(B.intro)return shell(sim.title,"",`<p>${esc(sim.intro)}</p><button class="btn" onclick="B.intro=false;bv()">Start</button>`);
  if(B.res){const all=B.res.every(r=>r.ok);
    return shell(sim.title,"Results",`<div class="res">${B.res.map(r=>`<span class="${r.ok?"ok":"no"}">${r.ok?"✓ Survived":"✗ Failed"}: ${esc(r.t.text)}</span>`).join("")}</div>
    <p>${all?"Your plan survives everything. Offline, in more than one place, out of reach of hackers.":"Your plan has holes. Adjust your choices and run it again."}</p>
    ${all?nextBtn():`<button class="btn" onclick="B.res=null;bv()">Change my plan</button>`}`)}
  shell(sim.title,`${B.pick.length} chosen`,`<p>Tap everything you'll use.</p><div class="bank">${sim.options.map((o,i)=>`<button class="chip ${B.pick.includes(i)?"sel":""}" onclick="bpick(${i})">${esc(o.name)}</button>`).join("")}</div>
  <button class="btn" ${B.pick.length?"":"disabled"} onclick="brun()">Run the disasters</button>`)}
function bpick(i){const k=B.pick.indexOf(i);k<0?B.pick.push(i):B.pick.splice(k,1);bv()}
function brun(){const ch=B.pick.map(i=>B.sim.options[i]);
  B.res=B.sim.threats.map(t=>({t,ok:t.type==="destroy"?ch.some(o=>o.survives.includes(t.id)):!ch.some(o=>o.exposed.includes(t.id))}));bv()}
async function finishSim(){const id=S.id;await post("/complete/"+id,{});const P=pstate();P.done[id]=true;jset("kcProg",P);R=C=B=null;reward(id)}

async function reward(id){
  const P=pstate(),m=mod(id);if(P.claims[id])return status(P.claims[id]);phase("earn");
  const pledged=!!localStorage.kcPledged;
  const pledges=["I will keep my recovery phrase offline, on paper or metal.","I will never type my phrase into a website or send it to anyone.","I will test a recovery with a small amount before I trust a backup."];
  $.innerHTML=`<div class="flow">${bar(3,"Earn: level complete")}<div class="stage"><h2>${esc(m.title)} done.</h2>
  <div class="recs"><div class="rec"><b>Quiz score</b><span>${Math.round((P.scores[id]||0)*100)}%</span></div><div class="rec"><b>Earned</b><span>+${m.sats} sats</span></div></div>
  ${pledged?"":`<p class="read" style="font-size:1.5rem">Make three promises to yourself:</p><div class="choices">${pledges.map(t=>`<label class="choice pledge"><input type="checkbox" onchange="pledgeCheck()"><span>${esc(t)}</span></label>`).join("")}</div>`}
  <input type="text" id="nm" placeholder="Name on your badge (optional)" maxlength="24" value="${esc(localStorage.kcName||"")}" aria-label="Name on your badge" autocomplete="off">
  <div class="acts"><button class="btn" id="pgo" ${pledged?"":"disabled"} onclick="claimForm('${id}')">Continue</button><button class="btn ghost" onclick="home()">Later</button></div></div></div>`;
}
function pledgeCheck(){document.getElementById("pgo").disabled=document.querySelectorAll(".pledge input:checked").length<3}
function claimForm(id){const m=mod(id);localStorage.kcName=document.getElementById("nm").value.trim();localStorage.kcPledged=1;
  $.innerHTML=`<div class="flow">${bar(3,"Earn: claim your sats")}<div class="stage"><div class="sats">${m.sats}<span style="font-size:.25em"> sats</span></div>
  <p class="read">Where should we send them?</p>
  <input type="text" id="dest" placeholder="you@wallet.com" value="${esc(localStorage.kcDest||"")}" aria-label="Lightning address or invoice" autocomplete="off" autocapitalize="off">
  <p class="err" id="err" aria-live="polite">Paste a Lightning address or invoice. We never hold your funds.</p>
  <div class="acts"><button class="btn" id="go" onclick="claim('${id}')">Claim ${m.sats} sats</button><button class="btn ghost" onclick="reward('${id}')">Back</button></div></div></div>`}
async function claim(id){
  const b=document.getElementById("go");b.disabled=true;const dest=document.getElementById("dest").value;
  const r=await post("/claim",{moduleId:id,destination:dest});
  if(r.error){document.getElementById("err").textContent=r.error;b.disabled=false;return}
  localStorage.kcDest=dest.trim();const P=pstate();P.claims[id]=r;jset("kcProg",P);status(r)}
function badge(c){const n=localStorage.kcName||"Key Keeper";
  return `<div class="badge"><div class="keywrap" style="max-width:260px">${keySvg([1,1,1])}</div><b>${esc(n)}</b><span>Key Keeper, passed on ${new Date(c.at||Date.now()).toLocaleDateString()}</span></div>`}
function saveBadge(){const n=localStorage.kcName||"Key Keeper",c=document.createElement("canvas");c.width=c.height=1080;const x=c.getContext("2d");
  x.fillStyle="#f0b84a";x.fillRect(0,0,1080,1080);x.fillStyle=x.strokeStyle="#0a0f2e";x.lineWidth=14;
  x.beginPath();x.arc(300,420,150,0,7);x.stroke();x.beginPath();x.arc(300,420,50,0,7);x.stroke();x.strokeRect(450,400,480,44);
  [70,100,56].forEach((h,i)=>x.fillRect(680+i*80,444,50,h));
  x.textAlign="center";x.font="800 110px 'Bricolage Grotesque',system-ui,sans-serif";x.fillText(n,540,720);
  x.font="500 48px Newsreader,Georgia,serif";x.fillText("Key-Ching Key Keeper",540,810);x.fillText(new Date().toLocaleDateString(),540,880);
  const a=document.createElement("a");a.download="key-keeper-badge.png";a.href=c.toDataURL();a.click()}
async function status(c){
  phase("earn");const paid=c.status==="paid";
  $.innerHTML=`<div class="flow">${bar(3,paid?"Paid":"Sending")}<div class="stage">
  ${paid?badge(c):`<div class="keywrap" style="max-width:420px">${keySvg([1,1,1])}</div>`}
  <h2>${paid?`${c.sats} sats sent.`:"Sending your sats…"}</h2>
  <p class="read">${paid?"Keep learning, and keep your phrase offline.":"This usually takes a few seconds."}</p>
  <div class="acts">${paid?`<button class="btn" onclick="saveBadge()">Save your badge</button>`:""}<button class="btn ghost" onclick="home()">Back to your key</button></div></div></div>`;
  if(c.status==="pending")setTimeout(async()=>{const n=(await api("/claims/"+uid))[c.moduleId];if(n&&document.body.dataset.p==="earn")status(n)},2000);
}
home();
</script></body></html>
